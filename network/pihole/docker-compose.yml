# Pi-hole v6 — network-wide DNS sinkhole with DHCP (OFF by default) and
# automatic DNS failover to the house router.
#
# Validation status: `docker compose config` verified (syntax). Live bring-up is
# deferred to the Raspberry era — see docs/runbooks/dhcp-migration.md and
# progress.md. DHCP ships DISABLED (PIHOLE_DHCP_ACTIVE=false in .env.example):
# `docker compose config` must keep showing it off before any `up`.
#
# SYNTAX RESEARCH (Pi-hole v6, checked 2026-11-05):
#   - v5->v6 env migration table, docs.pi-hole.net/docker/upgrading/v5-v6/:
#       DHCP_ACTIVE -> FTLCONF_dhcp_active, DHCP_START -> FTLCONF_dhcp_start,
#       DHCP_END   -> FTLCONF_dhcp_end,    DHCP_ROUTER -> FTLCONF_dhcp_router,
#       DHCP_IPv6  -> FTLCONF_dhcp_ipv6
#   - Full [dhcp] settings reference, docs.pi-hole.net/ftldns/configfile/:
#     active, start, end, router, netmask, leaseTime, ipv6, multiDNS,
#     rapidCommit, logging, ignoreUnknownClients, hosts. There is NO dhcp.dns
#     key in v6 (verified against FTL's src/config/config.c on master).
#   - Custom dnsmasq lines, docs.pi-hole.net/docker/upgrading/v5-v6/
#     ("Custom dnsmasq config files"): FTLCONF_misc_dnsmasq_lines injects raw
#     dnsmasq directives (";"-separated for multiple lines).
#   - Host networking for DHCP: docs.pi-hole.net/docker/DHCP/ — "DHCP runs best
#     with --net=host" (broadcasts cannot cross docker's bridge NAT).
#   - Listening mode: FTLCONF_dns_listeningMode (local|single|bind|all|none).
#
# DNS FAILOVER DESIGN (spec "Improvements over the article" #1 — replaces the
# old fallback-Wi-Fi "apanyo"):
#   Pi-hole's DHCP leases advertise  DNS1 = this host, DNS2 = the router,
#   via   FTLCONF_misc_dnsmasq_lines: dhcp-option=option:dns-server,0.0.0.0,${PIHOLE_DNS2_ROUTER}
#   dnsmasq semantics (FTL's own multiDNS code in src/config/dnsmasq_config.c
#   uses the same trick): 0.0.0.0 = "the address of the machine running
#   dnsmasq" (i.e. the Pi-hole host itself) — first entry = DNS1; the router
#   IP is appended as DNS2. An explicit dhcp-option replaces dnsmasq's default
#   (which would advertise only itself).
#   Result: Pi-hole down -> clients keep resolving through the router alone ->
#   the household keeps internet (ads return until Pi-hole is back). Nobody
#   switches SSIDs, nobody calls the helpdesk.
#   ACCEPTED TRADE-OFF (documented, not a bug): some clients occasionally use
#   DNS2 in normal operation and see unblocked ads. See the mandatory section
#   in docs/runbooks/dhcp-migration.md.
name: network

services:
  pihole:
    # Pinned to the latest stable v6 tag at research time (Docker Hub,
    # 2026-11-05). Published for amd64 and arm64 — arm64 matters because the
    # final home for this stack is a Raspberry Pi 5.
    image: pihole/pihole:2026.10.1
    container_name: pihole
    restart: unless-stopped

    # DHCP works over broadcast, which docker's bridge cannot relay — host
    # networking makes the container share the host's LAN interface. Required
    # for the DHCP server; also lets DNS (53) and the web UI (80/443) answer
    # directly on the host IP without port mappings (ports: is mutually
    # exclusive with network_mode: host).
    network_mode: host

    # NET_ADMIN: standard capability for DHCP (chmod the raw socket), per
    # docs.pi-hole.net/docker/configuration/ "Note on Capabilities".
    cap_add:
      - NET_ADMIN

    environment:
      TZ: ${TZ}
      # Web UI admin password — real value only ever in .env (gitignored).
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      # `local` = answer queries from directly connected subnets (the LAN).
      # With host networking that is exactly the house network. `all` would be
      # an open resolver — only needed for docker bridge setups.
      FTLCONF_dns_listeningMode: ${FTLCONF_dns_listeningMode}

      # ---- DHCP (inert while PIHOLE_DHCP_ACTIVE=false) ----------------------
      FTLCONF_dhcp_active: ${PIHOLE_DHCP_ACTIVE}
      FTLCONF_dhcp_start: ${PIHOLE_DHCP_START}
      FTLCONF_dhcp_end: ${PIHOLE_DHCP_END}
      FTLCONF_dhcp_router: ${PIHOLE_DHCP_ROUTER}
      FTLCONF_dhcp_ipv6: ${PIHOLE_DHCP_IPV6}

      # ---- DNS failover: leases carry DNS1=this host, DNS2=router -----------
      # 0.0.0.0 is dnsmasq's special value for "address of the interface where
      # the DHCP request was received" (= this host, the Pi-hole); the second
      # entry (router) becomes the fallback resolver for every client.
      FTLCONF_misc_dnsmasq_lines: dhcp-option=option:dns-server,0.0.0.0,${PIHOLE_DNS2_ROUTER}

    volumes:
      # All runtime state under ./data/ (gitignored via **/data/) so moving the
      # lab to the Raspberry is copy + rerun.
      - ./data/etc-pihole:/etc/pihole
      # Custom dnsmasq config files would land here; not read by default in v6
      # (needs FTLCONF_misc_etc_dnsmasq_d=true) — mounted for forward-compat.
      - ./data/dnsmasq.d:/etc/dnsmasq.d

    # Mirrors the HEALTHCHECK shipped in the official image (docker-pi-hole
    # src/Dockerfile): dig pi.hole locally, no recursion, no retries. Port 53
    # is dns.port's default (we never change it).
    healthcheck:
      test: ["CMD", "dig", "-p", "53", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
