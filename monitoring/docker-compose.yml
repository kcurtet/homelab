name: monitoring

networks:
  web:

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    networks: [web]
    ports:
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    networks: [web]
    volumes:
      - ./data/kuma:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`kuma.int.ntux.link`)
      - traefik.http.services.kuma.loadbalancer.server.port=3001

  # Daily image updates for EVERY container on this Docker host (not just this
  # project). Self-update disabled via label. Manual run:
  #   docker exec watchtower /watchtower --run-once
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      TZ: Europe/Madrid
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # daily 04:00
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
