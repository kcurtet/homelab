# Internal DNS — tailnet split-DNS for int.ntux.link
# Only answers *.int.ntux.link; everything else is not our business (no-resolv, no upstream)
no-resolv
no-hosts
domain-needed
no-poll
cache-size=1000

# Wildcard: everything under int.ntux.link -> this machine's tailnet IP
address=/int.ntux.link/100.120.247.5
local=/int.ntux.link/
