# Cloudflare Tunnel (cloudflared) — publish services without opening
# router ports
#
# REFERENCE CONTENT ONLY — this stack is intentionally INERT until a Cloudflare
# account, a domain and a tunnel exist. It is kept in the repo so the publishing
# path is ready the day the account does: see docs/runbooks/cloudflare-tunnel.md
# (STATUS: PENDING ACCOUNT). `docker compose config` validates today; `up`
# with an
# empty token just makes cloudflared exit — the runbook is the activation path.
#
# Image: official cloudflare/cloudflared, pinned to 2026.10.7 (Docker Hub,
# checked
# 2026-11-05; published for amd64 and arm64 — arm64 matters for the Raspberry Pi
# target). Version control over auto-upgrade, like the rest of the repo.
#
# Design notes:
#   - Token mode (`tunnel run` + TUNNEL_TOKEN) is the zero-config connector: the
#     ingress rules (public hostname → internal service) live in Cloudflare's
#     dashboard, not here, so repointing a hostname needs no change to
#     this file.
#   - No ports published, ever. cloudflared dials OUT to Cloudflare's edge; the
#     router forwards nothing to this host (lab rule: opening ports is a
#     last resort).
#   - extra_hosts maps host.docker.internal to the host gateway so ingress
#     rules can target the traefik edge: http://host.docker.internal:80 (the
#     vhost carries the Host header through). Not `localhost:<port>` — from
#     inside the container that is the container itself (classic gotcha,
#     documented in the runbook).
name: hosting

# Joined to the lab's shared network so console ingress rules can target
# the traefik edge directly: service https://traefik:443 with
# "Origin Server Name: jellyfin.int.ntux.link" (SNI) — the wildcard cert
# terminates TLS inside the tunnel.
networks:
  web:
    name: monitoring_web
    external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [web]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
