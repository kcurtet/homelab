# Coolify — self-hosted PaaS (lab hosting phase)
#
# Source of truth: the official installer (https://cdn.coollabs.io/coolify/install.sh,
# repo github.com/coollabsio/coolify) downloads docker-compose.yml + docker-compose.prod.yml
# from https://cdn.coollabs.io/coolify/ and runs them merged
# (-f docker-compose.yml -f docker-compose.prod.yml).
# This file is that merge for stable **Coolify 4.6.0** (versions.json, checked 2026-11-05),
# with the image tags the installer resolves (coollabsio/coolify:4.6.0, postgres:15-alpine,
# redis:7-alpine) pinned literally for reproducibility.
#
# Deliberate deviations from the official layout (all documented in docs/runbooks/hosting.md):
#   1. One file instead of the base/prod split — the split only serves the installer's
#      auto-upgrade flow, which this lab trades for version control.
#   2. ALL state is bind-mounted under ./data/ (the official install uses /data/coolify/ and
#      named volumes for postgres/redis) so the whole phase is one directory to move — the
#      spec requires retargeting to the Raspberry to be copy + rerun, not archaeology.
#   3. The `coolify` network is defined here instead of being created externally by the
#      installer, so `docker compose up -d` is self-contained.
# Note: since Coolify v4.4 realtime (soketi/reverb) runs inside the coolify container; the
# official compose keeps a 0-replica `soketi` placeholder only so upgrades from pre-4.4
# installs don't break. It is kept here for fidelity and never starts.

services:
  soketi:
    # Inert placeholder inherited from the official compose (see header note).
    image: coollabsio/coolify:4.6.0
    deploy:
      replicas: 0

  coolify:
    image: coollabsio/coolify:4.6.0
    container_name: coolify
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ./.env
        target: /var/www/html/.env
        read_only: true
      - ./data/ssh:/var/www/html/storage/app/ssh
      - ./data/applications:/var/www/html/storage/app/applications
      - ./data/databases:/var/www/html/storage/app/databases
      - ./data/services:/var/www/html/storage/app/services
      - ./data/backups:/var/www/html/storage/app/backups
      - ./data/images:/var/www/html/storage/app/images
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_FPM_PM_CONTROL=${PHP_FPM_PM_CONTROL:-dynamic}
      - PHP_FPM_PM_START_SERVERS=${PHP_FPM_PM_START_SERVERS:-1}
      - PHP_FPM_PM_MIN_SPARE_SERVERS=${PHP_FPM_PM_MIN_SPARE_SERVERS:-1}
      - PHP_FPM_PM_MAX_SPARE_SERVERS=${PHP_FPM_PM_MAX_SPARE_SERVERS:-10}
      - PUSHER_BACKEND_PORT=${PUSHER_BACKEND_PORT:-6001}
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8080"
      - "${REVERB_PORT:-6001}:6001"
      - "6002:6002"
    expose:
      - "${APP_PORT:-8000}"
      - "6001"
      - "6002"
    networks:
      coolify:
        # Realtime ran in the coolify-realtime container before v4.4; keep the alias for
        # proxy upstreams, as the official compose does.
        aliases:
          - coolify-realtime
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/api/health && curl --fail http://127.0.0.1:${PUSHER_BACKEND_PORT:-6001}/up || exit 1
      interval: 5s
      retries: 24
      start_period: 1m
      timeout: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: coolify-db
    restart: always
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE:-coolify}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}", "-d", "${DB_DATABASE:-coolify}" ]
      interval: 5s
      retries: 10
      timeout: 2s
    networks:
      - coolify

  redis:
    image: redis:7-alpine
    container_name: coolify-redis
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 10
      timeout: 2s
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    driver: bridge
